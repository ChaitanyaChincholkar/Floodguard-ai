services:
  db:
    image: postgis/postgis:15-3.4
    container_name: floodguard_db
    environment:
      POSTGRES_USER: floodguard_user
      POSTGRES_PASSWORD: floodguard_password
      POSTGRES_DB: floodguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: floodguard_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: floodguard_api
    environment:
      - DATABASE_URL=postgresql+asyncpg://floodguard_user:floodguard_password@db:5432/floodguard
      - REDIS_URL=redis://redis:6379/0
      - DEM_PROVIDER=real
      - RAINFALL_PROVIDER=synthetic
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: floodguard_worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://floodguard_user:floodguard_password@db:5432/floodguard
      - REDIS_URL=redis://redis:6379/0
      - DEM_PROVIDER=real
      - RAINFALL_PROVIDER=synthetic
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    command: celery -A app.ingestion.celery_app worker --loglevel=info
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: floodguard_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
